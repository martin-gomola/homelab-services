<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Field Notes Tours</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FIELD NOTES</a>
    <div class="privacy"><span></span> Protected private tour</div>
  </header>
  <main>
    <section class="player-shell">
      <div class="content">
        <p class="eyebrow" id="show-name">PRIVATE WALKING TOUR</p>
        <h1 id="title">Loading your tour…</h1>
        <p class="lede" id="summary"></p>
        <div class="metadata" id="metadata"></div>

        <div class="player">
          <button id="toggle" aria-label="Play" disabled>▶</button>
          <span class="clock"><span id="now">0:00</span> / <span id="duration">--:--</span></span>
        </div>
        <div class="scrub-wrap">
          <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Playback position" disabled>
          <span class="ticks" id="ticks"></span>
        </div>

        <nav class="tabs" aria-label="Tour details">
          <button class="tab active" data-panel="chapters">Chapters</button>
          <button class="tab" data-panel="route">Route map</button>
        </nav>
        <section id="chapters" class="panel active"></section>
        <section id="route" class="panel map-panel"><iframe id="route-frame" title="Interactive walking route"></iframe></section>
      </div>
      <aside>
        <img id="cover" alt="Tour cover">
        <div class="actions">
          <a id="spotify-link" class="primary" href="#">Open private episode in Spotify</a>
          <a id="start-link" href="#">Open starting point</a>
        </div>
        <p class="note">Audio stays behind the same protected domain. Signing out of the access gateway closes both this player and its media files.</p>
      </aside>
    </section>
  </main>
  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js" defer></script>
</body>
</html>
