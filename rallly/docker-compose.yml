name: rallly

# Rallly 4.x — self-hosted meeting poll scheduler.
#
# Public URL is terminated by nginx-proxy-manager on pi-commander, so Traefik
# is disabled (PROXY_MODE=external). The web container publishes on a LAN
# host port that NPM forwards to.
#
# Garage runs locally for S3-compatible object storage (user avatars, poll
# images). Postgres 18 is a fresh install for Rallly 4.x; this repo has no
# prior Rallly 3.x data to migrate.

services:
  rallly:
    image: lukevella/rallly:${RALLLY_VERSION:-4.16.3}
    container_name: rallly
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://rallly:${POSTGRES_PASSWORD}@rallly_postgres:5432/rallly
      S3_ENDPOINT: http://rallly_garage:3900
      S3_BUCKET_NAME: rallly
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "${RALLLY_PORT:-3032}:3000"
    depends_on:
      rallly_postgres:
        condition: service_healthy
      rallly_garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  rallly_postgres:
    image: postgres:18-alpine
    container_name: rallly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rallly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rallly
    volumes:
      - ${DATA_DIR:-/srv/docker}/rallly/db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallly -d rallly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  rallly_garage:
    image: dxflrs/garage:v2.3.0
    container_name: rallly_garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: rallly
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ${DATA_DIR:-/srv/docker}/rallly/garage-meta:/var/lib/garage/meta
      - ${DATA_DIR:-/srv/docker}/rallly/garage-data:/var/lib/garage/data
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
