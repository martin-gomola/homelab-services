title: Plant Sensors
views:
  - title: Plants
    path: overview
    icon: mdi:sprout
    type: sections
    max_columns: 2
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Plant care
            heading_style: title
            icon: mdi:leaf-circle-outline

          - type: custom:mushroom-template-card
            primary: >-
              {% set p1 = states('sensor.plant_01_soil_moisture') %}
              {% set p2 = states('sensor.plant_02_soil_moisture') %}
              {% if p1 in ['unknown', 'unavailable'] or p2 in ['unknown', 'unavailable'] %}
                Waiting for a sensor update
              {% elif p1 | int(0) < 25 or is_state('binary_sensor.plant_02_dry', 'on') %}
                Watering needed
              {% elif not is_state('sensor.plant_01_soil_fertility_warning', '0') %}
                Plant 01 needs fertilizer
              {% else %}
                Both plants look good
              {% endif %}
            secondary: >-
              {% set items = namespace(value=[]) %}
              {% set p1 = states('sensor.plant_01_soil_moisture') %}
              {% set p2 = states('sensor.plant_02_soil_moisture') %}
              {% if p1 in ['unknown', 'unavailable'] %}
                {% set items.value = items.value + ['Plant 01 has not reported yet'] %}
              {% elif p1 | int(0) < 25 %}
                {% set items.value = items.value + ['Plant 01 soil is ' ~ p1 ~ '%'] %}
              {% endif %}
              {% if p2 in ['unknown', 'unavailable'] %}
                {% set items.value = items.value + ['Plant 02 has not reported yet'] %}
              {% elif is_state('binary_sensor.plant_02_dry', 'on') %}
                {% set items.value = items.value + ['Plant 02 soil is ' ~ p2 ~ '%'] %}
              {% endif %}
              {% if states('sensor.plant_01_soil_fertility_warning') not in ['0', 'unknown', 'unavailable'] %}
                {% set items.value = items.value + ['Plant 01 fertility is low'] %}
              {% endif %}
              {{ items.value | join(' | ') if items.value else 'No care action is needed right now' }}
            icon: >-
              {% set p1 = states('sensor.plant_01_soil_moisture') %}
              {% set p2 = states('sensor.plant_02_soil_moisture') %}
              {% if p1 in ['unknown', 'unavailable'] or p2 in ['unknown', 'unavailable'] %}
                mdi:sync-alert
              {% elif p1 | int(0) < 25 or is_state('binary_sensor.plant_02_dry', 'on') %}
                mdi:watering-can-outline
              {% elif states('sensor.plant_01_soil_fertility_warning') not in ['0', 'unknown', 'unavailable'] %}
                mdi:flask-outline
              {% else %}
                mdi:check-circle-outline
              {% endif %}
            icon_color: >-
              {% set p1 = states('sensor.plant_01_soil_moisture') %}
              {% set p2 = states('sensor.plant_02_soil_moisture') %}
              {% if p1 in ['unknown', 'unavailable'] or p2 in ['unknown', 'unavailable'] %}
                grey
              {% elif p1 | int(0) < 25 or is_state('binary_sensor.plant_02_dry', 'on') %}
                red
              {% elif states('sensor.plant_01_soil_fertility_warning') not in ['0', 'unknown', 'unavailable'] %}
                amber
              {% else %}
                green
              {% endif %}
            multiline_secondary: true
            tap_action:
              action: none
            grid_options:
              columns: full
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Plant 01
            heading_style: title
            icon: mdi:flower-outline

          - type: custom:mushroom-template-card
            entity: sensor.plant_01_soil_moisture
            primary: >-
              {% set soil = states('sensor.plant_01_soil_moisture') %}
              {% if soil in ['unknown', 'unavailable'] %}
                Waiting for sensor update
              {% elif soil | int(0) < 25 %}
                Needs water
              {% elif states('sensor.plant_01_soil_fertility_warning') not in ['0', 'unknown', 'unavailable'] %}
                Low fertility
              {% else %}
                Healthy
              {% endif %}
            secondary: >-
              {% if states('sensor.plant_01_soil_moisture') not in ['unknown', 'unavailable'] %}
                Updated {{ relative_time(states.sensor.plant_01_soil_moisture.last_updated) }} ago
              {% else %}
                The sensor will update on its next report
              {% endif %}
            icon: mdi:flower
            icon_color: >-
              {% set soil = states('sensor.plant_01_soil_moisture') %}
              {% if soil in ['unknown', 'unavailable'] %}grey
              {% elif soil | int(0) < 25 %}red
              {% elif states('sensor.plant_01_soil_fertility_warning') not in ['0', 'unknown', 'unavailable'] %}amber
              {% else %}green{% endif %}
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1

          - type: tile
            entity: sensor.plant_01_soil_moisture
            name: Soil moisture
            icon: mdi:water-percent
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_01_temperature
            name: Temperature
            icon: mdi:thermometer
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_01_humidity
            name: Air humidity
            icon: mdi:water-outline
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_01_battery
            name: Battery
            icon: mdi:battery
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: sensor.plant_01_soil_fertility
                icon: mdi:flask-outline
                content: >-
                  Fertility {{ states('sensor.plant_01_soil_fertility') }} uS/cm
                icon_color: >-
                  {% set value = states('sensor.plant_01_soil_fertility') %}
                  {% if value in ['unknown', 'unavailable'] %}grey
                  {% elif value | int(0) < 1200 %}red
                  {% elif value | int(0) < 2000 %}amber
                  {% else %}green{% endif %}
              - type: template
                entity: sensor.plant_01_illuminance
                icon: mdi:white-balance-sunny
                content: >-
                  Light {{ states('sensor.plant_01_illuminance') }} lx
                icon_color: >-
                  {% set value = states('sensor.plant_01_illuminance') %}
                  {% if value in ['unknown', 'unavailable'] %}grey
                  {% elif value | int(0) < 200 %}red
                  {% elif value | int(0) < 1500 %}amber
                  {% else %}green{% endif %}
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Plant 02
            heading_style: title
            icon: mdi:flower-tulip-outline

          - type: custom:mushroom-template-card
            entity: sensor.plant_02_soil_moisture
            primary: >-
              {% set soil = states('sensor.plant_02_soil_moisture') %}
              {% if soil in ['unknown', 'unavailable'] %}
                Waiting for sensor update
              {% elif is_state('binary_sensor.plant_02_dry', 'on') %}
                Needs water
              {% else %}
                Healthy
              {% endif %}
            secondary: >-
              {% if states('sensor.plant_02_soil_moisture') not in ['unknown', 'unavailable'] %}
                Updated {{ relative_time(states.sensor.plant_02_soil_moisture.last_updated) }} ago
              {% else %}
                The sensor will update on its next report
              {% endif %}
            icon: mdi:flower-tulip
            icon_color: >-
              {% set soil = states('sensor.plant_02_soil_moisture') %}
              {% if soil in ['unknown', 'unavailable'] %}grey
              {% elif is_state('binary_sensor.plant_02_dry', 'on') %}red
              {% else %}green{% endif %}
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1

          - type: tile
            entity: sensor.plant_02_soil_moisture
            name: Soil moisture
            icon: mdi:water-percent
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_02_temperature
            name: Temperature
            icon: mdi:thermometer
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_02_humidity
            name: Air humidity
            icon: mdi:water-outline
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: tile
            entity: sensor.plant_02_battery
            name: Battery
            icon: mdi:battery
            vertical: false
            grid_options:
              columns: 6
              rows: 1

          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: binary_sensor.plant_02_dry
                icon: >-
                  {% if is_state('binary_sensor.plant_02_dry', 'on') %}
                    mdi:water-alert
                  {% else %}
                    mdi:check-circle-outline
                  {% endif %}
                content: >-
                  {% if is_state('binary_sensor.plant_02_dry', 'on') %}
                    Dry warning
                  {% else %}
                    Moisture OK
                  {% endif %}
                icon_color: >-
                  {% if is_state('binary_sensor.plant_02_dry', 'on') %}red
                  {% else %}green{% endif %}
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Seven-day trends
            heading_style: title
            icon: mdi:chart-line

          - type: statistics-graph
            title: Soil moisture
            chart_type: line
            days_to_show: 7
            period: hour
            stat_types:
              - mean
            entities:
              - entity: sensor.plant_01_soil_moisture
                name: Plant 01
                color: red
              - entity: sensor.plant_02_soil_moisture
                name: Plant 02
                color: green
            grid_options:
              columns: 12
              rows: 4

          - type: statistics-graph
            title: Temperature
            chart_type: line
            days_to_show: 7
            period: hour
            stat_types:
              - mean
            entities:
              - entity: sensor.plant_01_temperature
                name: Plant 01
                color: red
              - entity: sensor.plant_02_temperature
                name: Plant 02
                color: green
            grid_options:
              columns: 12
              rows: 4

          - type: custom:mushroom-template-card
            primary: Detailed trends
            secondary: Light, fertility, humidity, and raw 24-hour history
            icon: mdi:chart-timeline-variant
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /house-plants/trends
            grid_options:
              columns: 12
              rows: 1

          - type: custom:mushroom-template-card
            primary: Sensor settings
            secondary: Thresholds, sampling, and calibration
            icon: mdi:tune-variant
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /house-plants/settings
            grid_options:
              columns: 12
              rows: 1

  - title: Detailed trends
    path: trends
    subview: true
    back_path: /house-plants/overview
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Plant 01
            heading_style: title
            icon: mdi:flower-outline

          - type: history-graph
            title: Environment - last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.plant_01_soil_moisture
                name: Soil moisture
              - entity: sensor.plant_01_humidity
                name: Air humidity
              - entity: sensor.plant_01_temperature
                name: Temperature
            grid_options:
              columns: 12
              rows: 5

          - type: history-graph
            title: Light and fertility - last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.plant_01_illuminance
                name: Light
              - entity: sensor.plant_01_soil_fertility
                name: Soil fertility
            grid_options:
              columns: 12
              rows: 5

      - type: grid
        cards:
          - type: heading
            heading: Plant 02
            heading_style: title
            icon: mdi:flower-tulip-outline

          - type: history-graph
            title: Environment - last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.plant_02_soil_moisture
                name: Soil moisture
              - entity: sensor.plant_02_humidity
                name: Air humidity
              - entity: sensor.plant_02_temperature
                name: Temperature
            grid_options:
              columns: 12
              rows: 5

  - title: Sensor settings
    path: settings
    subview: true
    back_path: /house-plants/overview
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Plant 01 thresholds
            heading_style: title
            icon: mdi:tune-variant

          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.plant_01_soil_warning
                name: Soil warning
              - entity: number.plant_01_soil_fertility_warning_setting
                name: Fertility warning
              - entity: number.plant_01_soil_sampling
                name: Sampling interval

      - type: grid
        cards:
          - type: heading
            heading: Plant 01 calibration
            heading_style: title
            icon: mdi:scale-balance

          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.plant_01_humidity_calibration
                name: Humidity
              - entity: number.plant_01_temperature_calibration
                name: Temperature
              - entity: number.plant_01_soil_calibration
                name: Soil moisture
              - entity: number.plant_01_illuminance_calibration
                name: Light

      - type: grid
        cards:
          - type: heading
            heading: Plant 02 thresholds
            heading_style: title
            icon: mdi:tune-variant

          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.plant_02_dry
                name: Dry warning
              - entity: select.plant_02_temperature_unit
                name: Temperature unit
              - entity: number.plant_02_soil_warning
                name: Soil warning
              - entity: number.plant_02_soil_sampling
                name: Soil sampling interval
              - entity: number.plant_02_temperature_sampling
                name: Temperature sampling interval

      - type: grid
        cards:
          - type: heading
            heading: Plant 02 calibration
            heading_style: title
            icon: mdi:scale-balance

          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.plant_02_soil_calibration
                name: Soil moisture
              - entity: number.plant_02_humidity_calibration
                name: Humidity
              - entity: number.plant_02_temperature_calibration
                name: Temperature
