title: Commute
views:
  - title: Commute
    path: commute
    icon: mdi:bus-clock
    type: sections
    max_columns: 2
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Travel conditions
            heading_style: title
            icon: mdi:weather-partly-cloudy

          - type: tile
            entity: weather.forecast_home
            name: Outside now
            icon: mdi:weather-partly-cloudy
            state_content:
              - state
              - temperature
            vertical: false
            grid_options:
              columns: 12
              rows: 1

          - type: custom:mushroom-template-card
            primary: Timetable status
            secondary: >-
              {% set outbound = state_attr('sensor.cp_to_nova_doba', 'updated_at') %}
              {% set inbound = state_attr('sensor.cp_to_hubeneho', 'updated_at') %}
              {% set updated = outbound or inbound %}
              {% if updated %}
                Updated {{ relative_time(as_datetime(updated)) }} ago
              {% else %}
                Waiting for timetable data
              {% endif %}
            icon: >-
              {% if states('sensor.cp_to_nova_doba') in ['unknown', 'unavailable']
                    or states('sensor.cp_to_hubeneho') in ['unknown', 'unavailable'] %}
                mdi:cloud-alert-outline
              {% else %}
                mdi:cloud-check-outline
              {% endif %}
            icon_color: >-
              {% if states('sensor.cp_to_nova_doba') in ['unknown', 'unavailable']
                    or states('sensor.cp_to_hubeneho') in ['unknown', 'unavailable'] %}
                amber
              {% else %}
                green
              {% endif %}
            tap_action:
              action: none
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: To Nova doba
            heading_style: title
            icon: mdi:arrow-right-circle-outline

          - type: custom:mushroom-template-card
            entity: sensor.cp_to_nova_doba
            primary: >-
              {% set minutes = state_attr('sensor.cp_to_nova_doba', 'next_minutes_until') | int(-1) %}
              {% if states('sensor.cp_to_nova_doba') in ['unknown', 'unavailable'] or minutes < 0 %}
                Timetable unavailable
              {% elif minutes == 0 %}
                Departing now
              {% elif minutes < 60 %}
                Next bus in {{ minutes }} min
              {% else %}
                Next bus {{ (as_timestamp(now()) + minutes * 60) | timestamp_custom('%A', true) }}
                at {{ states('sensor.cp_to_nova_doba') }}
              {% endif %}
            secondary: >-
              {% set arrival = state_attr('sensor.cp_to_nova_doba', 'next_arrival') %}
              {% set lines = state_attr('sensor.cp_to_nova_doba', 'next_lines') or [] %}
              {% if states('sensor.cp_to_nova_doba') in ['unknown', 'unavailable'] %}
                Timetable data will refresh automatically
              {% else %}
                Departs {{ states('sensor.cp_to_nova_doba') }} | arrives {{ arrival }}
                {% if lines %}| {{ lines | join(' + ') }}{% endif %}
              {% endif %}
            icon: mdi:bus
            icon_color: >-
              {% set minutes = state_attr('sensor.cp_to_nova_doba', 'next_minutes_until') | int(-1) %}
              {% if minutes < 0 %}grey
              {% elif minutes <= 15 %}red
              {% elif minutes <= 45 %}amber
              {% else %}green{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1

          - type: custom:mushroom-template-card
            entity: sensor.cp_to_nova_doba
            primary: >-
              {% set trips = state_attr('sensor.cp_to_nova_doba', 'connections') or [] %}
              {% if trips | count > 1 %}
                {{ trips[1].departure }} -> {{ trips[1].arrival }}
              {% else %}
                No later departure
              {% endif %}
            secondary: >-
              {% set trips = state_attr('sensor.cp_to_nova_doba', 'connections') or [] %}
              {% if trips | count > 1 %}
                {% set trip = trips[1] %}
                {{ (as_timestamp(now()) + (trip.minutes_until | int(0)) * 60) | timestamp_custom('%A', true) }}
                {% if trip.lines %}| {{ trip.lines | join(' + ') }}{% endif %}
              {% else %}
                Check the full timetable
              {% endif %}
            icon: mdi:bus-clock
            icon_color: green
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1

          - type: custom:mushroom-template-card
            entity: sensor.cp_to_nova_doba
            primary: >-
              {% set trips = state_attr('sensor.cp_to_nova_doba', 'connections') or [] %}
              {% if trips | count > 2 %}
                {{ trips[2].departure }} -> {{ trips[2].arrival }}
              {% else %}
                No later departure
              {% endif %}
            secondary: >-
              {% set trips = state_attr('sensor.cp_to_nova_doba', 'connections') or [] %}
              {% if trips | count > 2 %}
                {% set trip = trips[2] %}
                {{ (as_timestamp(now()) + (trip.minutes_until | int(0)) * 60) | timestamp_custom('%A', true) }}
                {% if trip.lines %}| {{ trip.lines | join(' + ') }}{% endif %}
              {% else %}
                Check the full timetable
              {% endif %}
            icon: mdi:bus-clock
            icon_color: green
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1

          - type: markdown
            content: >-
              [**Open full timetable**]({{ state_attr('sensor.cp_to_nova_doba', 'query_url') }})
            grid_options:
              columns: 12
              rows: auto

