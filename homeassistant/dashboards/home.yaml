title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sidebar
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: >-
              {%- if now().hour < 12 -%}Good morning
              {%- elif now().hour < 18 -%}Good afternoon
              {%- else -%}Good evening{%- endif -%}, {{ user }}.
            subtitle: >-
              {{ states('weather.forecast_home') | capitalize }}
              · {{ state_attr('weather.forecast_home', 'temperature') }}°C

          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: sensor.plant_01_soil_moisture
                icon: mdi:sprout-outline
                content: "P1 {{ states('sensor.plant_01_soil_moisture') }}%"
                icon_color: |-
                  {% set m = states('sensor.plant_01_soil_moisture') | int(0) %}
                  {% if m < 25 %}red
                  {% elif m < 45 %}amber
                  {% else %}green{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /house-plants/overview

              - type: template
                entity: sensor.plant_02_soil_moisture
                icon: mdi:sprout
                content: "P2 {{ states('sensor.plant_02_soil_moisture') }}%"
                icon_color: |-
                  {% set m = states('sensor.plant_02_soil_moisture') | int(0) %}
                  {% if m < 25 %}red
                  {% elif m < 45 %}amber
                  {% else %}green{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /house-plants/overview

              - type: template
                entity: sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4
                icon: mdi:air-filter
                content: "PM2.5 {{ states('sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4') }}"
                icon_color: |-
                  {% set pm = states('sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4') | int(0) %}
                  {% if pm > 120 %}red
                  {% elif pm > 35 %}amber
                  {% else %}green{% endif %}

              - type: template
                entity: sensor.humidifier_humidity
                icon: mdi:water-percent
                content: "{{ states('sensor.humidifier_humidity') }}%"
                icon_color: |-
                  {% set h = states('sensor.humidifier_humidity') | int(0) %}
                  {% if h < 35 %}red
                  {% elif h < 45 %}amber
                  {% else %}green{% endif %}

              - type: entity
                entity: sensor.cp_to_nova_doba
                icon: mdi:bus-clock
                tap_action:
                  action: navigate
                  navigation_path: /house-commute/commute

          - type: conditional
            conditions:
              - entity: binary_sensor.humidifier_tank
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: binary_sensor.humidifier_tank
              primary: Humidifier tank is empty
              secondary: Refill before running bedroom humidity control
              icon: mdi:cup-water
              icon_color: red

          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily

          - type: grid
            title: Commute
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.cp_to_nova_doba
                name: To Nova doba
                icon: mdi:bus-clock
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /house-commute/commute
              - type: custom:mushroom-entity-card
                entity: sensor.cp_to_hubeneho
                name: Back to Hubeneho
                icon: mdi:bus-clock
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /house-commute/commute

      - type: custom:mushroom-title-card
        title: Quick Controls
        subtitle: Lights, air, and plugs you toggle most often.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.yeelight_stripe_0x12a2e794
            name: Light Strip
            icon: mdi:led-strip-variant
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-entity-card
            entity: switch.humidifier_power
            name: Humidifier
            icon: mdi:air-humidifier
            icon_color: blue
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.zhimi_de_319110959_mb4_on_p_2_1
            name: Air Purifier
            icon: mdi:air-purifier
            icon_color: green
            tap_action:
              action: toggle
          - type: custom:mushroom-fan-card
            entity: fan.zhimi_de_106389295_za4_s_2_fan
            name: Bedroom Fan
            icon_animation: true
            show_percentage_control: true
            collapsible_controls: true
          - type: custom:mushroom-entity-card
            entity: switch.living_room
            name: Living Room Switch
            icon: mdi:toggle-switch
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.kitchen
            name: Kitchen Switch
            icon: mdi:toggle-switch
            tap_action:
              action: toggle

      - type: custom:mushroom-title-card
        title: Rooms
        subtitle: One tap into the spaces that need attention.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Living Room
            secondary: >-
              Light {{ states('light.yeelight_stripe_0x12a2e794') }}
              · PM2.5 {{ states('sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4') }}
            icon: mdi:sofa-outline
            icon_color: |-
              {% if is_state('light.yeelight_stripe_0x12a2e794', 'on') %}orange
              {% else %}disabled{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-rooms/living-room
          - type: custom:mushroom-template-card
            primary: Bedroom
            secondary: >-
              {{ states('sensor.humidifier_temperature') }}°C
              · {{ states('sensor.humidifier_humidity') }}% humidity
            icon: mdi:bed-king-outline
            icon_color: |-
              {% set h = states('sensor.humidifier_humidity') | int(0) %}
              {% if h < 35 %}red
              {% elif h < 45 %}amber
              {% else %}blue{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-rooms/bedroom
          - type: custom:mushroom-template-card
            primary: Kitchen
            secondary: >-
              Plug {{ states('switch.kitchen') }}
            icon: mdi:silverware-fork-knife
            icon_color: |-
              {% if is_state('switch.kitchen', 'on') %}orange
              {% else %}disabled{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-rooms/kitchen
          - type: custom:mushroom-template-card
            primary: Plants
            secondary: >-
              P1 {{ states('sensor.plant_01_soil_moisture') }}%
              · P2 {{ states('sensor.plant_02_soil_moisture') }}%
            icon: mdi:sprout
            icon_color: |-
              {% set p1 = states('sensor.plant_01_soil_moisture') | int(0) %}
              {% set p2 = states('sensor.plant_02_soil_moisture') | int(0) %}
              {% if p1 < 25 or p2 < 25 %}red
              {% elif p1 < 45 or p2 < 45 %}amber
              {% else %}green{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-plants/overview

      - type: custom:mushroom-title-card
        title: Environment
        subtitle: Compact readings for two plant sensors and bedroom air.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.plant_01_soil_moisture
            primary: Plant 01
            secondary: >-
              Soil {{ states('sensor.plant_01_soil_moisture') }}%
              · {{ states('sensor.plant_01_temperature') }}°C
              · Battery {{ states('sensor.plant_01_battery') }}%
            icon: mdi:flower
            icon_color: |-
              {% set m = states('sensor.plant_01_soil_moisture') | int(0) %}
              {% if m < 25 %}red
              {% elif m < 45 %}amber
              {% else %}green{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-plants/overview
          - type: custom:mushroom-template-card
            entity: sensor.plant_02_soil_moisture
            primary: Plant 02
            secondary: >-
              Soil {{ states('sensor.plant_02_soil_moisture') }}%
              · {{ states('sensor.plant_02_temperature') }}°C
              · Battery {{ states('sensor.plant_02_battery') }}%
            icon: mdi:flower-outline
            icon_color: |-
              {% set m = states('sensor.plant_02_soil_moisture') | int(0) %}
              {% if m < 25 %}red
              {% elif m < 45 %}amber
              {% else %}green{% endif %}
            tap_action:
              action: navigate
              navigation_path: /house-plants/overview
          - type: custom:mushroom-template-card
            entity: sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4
            primary: Air Quality
            secondary: "PM2.5 {{ states('sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4') }} µg/m³"
            icon: mdi:air-filter
            icon_color: |-
              {% set pm = states('sensor.zhimi_de_319110959_mb4_pm2_5_density_p_3_4') | int(0) %}
              {% if pm > 120 %}red
              {% elif pm > 35 %}amber
              {% else %}green{% endif %}
          - type: custom:mushroom-template-card
            entity: sensor.humidifier_humidity
            primary: Bedroom Comfort
            secondary: >-
              {{ states('sensor.humidifier_humidity') }}%
              · {{ states('sensor.humidifier_temperature') }}°C
            icon: mdi:water-percent
            icon_color: |-
              {% set h = states('sensor.humidifier_humidity') | int(0) %}
              {% if h < 35 %}red
              {% elif h < 45 %}amber
              {% else %}blue{% endif %}
